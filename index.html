<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b45309">
<title>গল্প বাংলা — বাংলা গল্পের বিশ্ব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Baloo+Da+2:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --brand:#b45309;--brand-dark:#92400e;--brand-light:#f59e0b;
  --gold:#fbbf24;--gold-light:#fcd34d;--gold-dark:#d97706;
  --bg:#1a1208;--bg-alt:#241a0d;--surface:#2a1f10;--surface-hover:#352814;
  --text:#fef3c7;--text-secondary:#d4a574;--text-muted:#8b6f47;
  --border:#3d2e17;--border-light:#4a3819;
  --danger:#ef4444;--success:#10b981;
  --shadow-gold:0 10px 40px -10px rgba(251,191,36,.3);
  --font-bn:'Hind Siliguri',system-ui,sans-serif;
  --font-story:'Baloo Da 2',system-ui,sans-serif;
  --font-en:'Plus Jakarta Sans',system-ui,sans-serif;
}
[data-theme="light"]{
  --bg:#fef9f0;--bg-alt:#fef3e0;--surface:#ffffff;--surface-hover:#fff8ed;
  --text:#451a03;--text-secondary:#78350f;--text-muted:#a16207;
  --border:#fed7aa;--border-light:#fef3c7;
}
html,body{height:100%}
body{font-family:var(--font-bn);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;transition:background .4s,color .4s;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brand);border-radius:10px}

/* ============ SPLASH / LOADING ============ */
#splash{
  position:fixed;inset:0;z-index:99999;
  background:radial-gradient(ellipse at center,#2a1f10 0%,#1a1208 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s;
}
#splash.hide{opacity:0;pointer-events:none}

/* বই খোলার অ্যানিমেশন */
.book-wrap{
  perspective:1200px;
  margin-bottom:30px;
  position:relative;
}
.book{
  width:120px;height:160px;
  position:relative;
  transform-style:preserve-3d;
  animation:bookOpen 2s ease-in-out infinite;
}
@keyframes bookOpen{
  0%,100%{transform:rotateY(0deg)}
  50%{transform:rotateY(-30deg)}
}
.book-cover{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#b45309,#92400e);
  border-radius:8px 12px 12px 8px;
  border:3px solid var(--gold);
  box-shadow:
    0 0 30px rgba(251,191,36,.4),
    inset 0 0 30px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;
  transform-origin:left center;
  animation:coverFlip 2s ease-in-out infinite;
  backface-visibility:hidden;
}
@keyframes coverFlip{
  0%,100%{transform:rotateY(0deg)}
  50%{transform:rotateY(-160deg)}
}
.book-pages{
  position:absolute;inset:0;
  background:linear-gradient(135deg,#fef3c7,#fcd34d);
  border-radius:8px 12px 12px 8px;
  border:3px solid var(--gold-dark);
  display:flex;align-items:center;justify-content:center;
  font-size:40px;
  color:#92400e;
}

/* "গল্প বাংলা" লোগো */
.splash-title{
  font-family:var(--font-story);
  font-size:clamp(38px,10vw,60px);
  font-weight:800;
  letter-spacing:-1px;
  background:linear-gradient(135deg,#fcd34d 0%,#f59e0b 40%,#b45309 100%);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  display:flex;gap:4px;justify-content:center;
  margin-bottom:12px;
  filter:drop-shadow(0 4px 20px rgba(251,191,36,.4));
}
.splash-title span{
  display:inline-block;
  opacity:0;
  transform:translateY(30px) rotate(-10deg) scale(.5);
  animation:letterReveal .6s forwards;
}
@keyframes letterReveal{
  0%{opacity:0;transform:translateY(30px) rotate(-10deg) scale(.5)}
  60%{opacity:1;transform:translateY(-8px) rotate(3deg) scale(1.15)}
  100%{opacity:1;transform:translateY(0) rotate(0deg) scale(1)}
}

.splash-sub{
  font-size:13px;
  color:var(--text-secondary);
  letter-spacing:4px;
  text-transform:uppercase;
  opacity:0;
  animation:fadeUp .8s 1.2s forwards;
  margin-bottom:40px;
}
@keyframes fadeUp{to{opacity:.85;transform:translateY(0)}from{opacity:0;transform:translateY(15px)}}

.splash-bar-wrap{
  width:240px;height:4px;
  background:rgba(251,191,36,.15);
  border-radius:99px;overflow:hidden;
  margin-bottom:16px;
}
.splash-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,#fcd34d,#f59e0b,#b45309);
  border-radius:99px;
  animation:barFill 2.4s .3s forwards;
}
@keyframes barFill{to{width:100%}}

.splash-status{
  font-size:12px;
  color:var(--text-muted);
  font-weight:500;
  letter-spacing:.5px;
  opacity:0;
  animation:fadeUp .5s .5s forwards;
}

/* ============ HEADER ============ */
.header{
  position:sticky;top:0;z-index:100;
  background:rgba(26,18,8,.85);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
}
[data-theme="light"] .header{background:rgba(254,249,240,.85)}
.header-inner{max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:none;color:inherit;font-family:inherit}
.brand-logo{
  width:42px;height:42px;border-radius:10px;
  background:linear-gradient(135deg,#b45309,#92400e);
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;
  box-shadow:0 4px 12px rgba(251,191,36,.3);
}
.brand-text{display:flex;flex-direction:column;line-height:1.1;text-align:left}
.brand-name{font-family:var(--font-story);font-size:18px;font-weight:800;color:var(--gold-light)}
.brand-tag{font-size:10px;color:var(--text-muted);font-weight:500}

.header-actions{display:flex;gap:8px;align-items:center}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  background:var(--surface);border:1.5px solid var(--border);
  color:var(--text-secondary);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.icon-btn:hover{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ============ MAIN ============ */
main{max-width:1240px;margin:0 auto;padding:20px 16px 100px}

/* ============ HERO / WELCOME ============ */
.hero{
  background:linear-gradient(135deg,rgba(180,83,9,.3),rgba(146,64,14,.15));
  border:2px solid rgba(251,191,36,.2);
  border-radius:20px;
  padding:28px 22px;
  margin-bottom:24px;
  position:relative;overflow:hidden;
  animation:fadeIn .5s;
}
.hero::before{
  content:'📖';
  position:absolute;font-size:150px;
  right:-30px;bottom:-40px;opacity:.08;
  transform:rotate(-15deg);
}
.hero-title{
  font-family:var(--font-story);
  font-size:clamp(22px,4vw,32px);
  font-weight:800;
  color:var(--gold-light);
  margin-bottom:8px;
  position:relative;z-index:1;
  line-height:1.2;
}
.hero-sub{
  font-size:14px;color:var(--text-secondary);
  margin-bottom:18px;position:relative;z-index:1;
  line-height:1.7;
}
.hero-buttons{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.hero-btn{
  padding:12px 22px;border-radius:12px;
  background:linear-gradient(135deg,#b45309,#92400e);
  color:#fff;font-family:var(--font-en);font-weight:700;font-size:14px;
  display:inline-flex;align-items:center;gap:8px;
  box-shadow:0 4px 0 #78350f;
  transition:all .15s;
}
.hero-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #78350f}
.hero-btn.ghost{
  background:transparent;border:1.5px solid var(--gold);
  color:var(--gold-light);box-shadow:none;
}
.hero-btn.ghost:active{transform:scale(.97)}

/* ============ SECTION ============ */
.section{margin-bottom:32px;animation:fadeIn .6s}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

.section-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;gap:12px;flex-wrap:wrap;
}
.section-title{
  font-family:var(--font-story);
  font-size:20px;font-weight:800;
  color:var(--text);
  display:flex;align-items:center;gap:10px;
}
.section-title i{color:var(--gold);font-size:18px}
.section-badge{
  font-size:11px;font-weight:700;
  color:var(--gold-light);
  background:rgba(251,191,36,.12);
  padding:4px 12px;border-radius:99px;
  border:1px solid rgba(251,191,36,.25);
}
.see-all{
  font-size:12px;font-weight:700;
  color:var(--gold);cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
}
.see-all:hover{color:var(--gold-light)}

/* ============ CATEGORY CHIPS ============ */
.cat-scroll{
  display:flex;gap:10px;overflow-x:auto;
  padding-bottom:8px;margin-bottom:20px;
  scrollbar-width:none;
}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-chip{
  flex-shrink:0;
  padding:10px 18px;border-radius:99px;
  background:var(--surface);border:1.5px solid var(--border);
  font-size:13px;font-weight:700;
  color:var(--text-secondary);
  cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;
}
.cat-chip:hover{border-color:var(--gold);color:var(--gold-light)}
.cat-chip.active{
  background:linear-gradient(135deg,#b45309,#92400e);
  color:#fff;border-color:var(--gold);
  box-shadow:0 4px 12px rgba(251,191,36,.3);
}
.cat-emoji{font-size:16px}

/* ============ STORY CARDS ============ */
.story-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:14px;
}
.story-card{
  background:var(--surface);
  border:1.5px solid var(--border);
  border-radius:16px;
  overflow:hidden;
  cursor:pointer;
  transition:all .25s;
  display:flex;flex-direction:column;
  position:relative;
}
.story-card:hover{
  transform:translateY(-4px);
  border-color:var(--gold);
  box-shadow:0 12px 30px rgba(251,191,36,.15);
}
.story-cover{
  height:130px;
  background:linear-gradient(135deg,#b45309,#92400e);
  position:relative;
  display:flex;align-items:center;justify-content:center;
  font-size:54px;
  overflow:hidden;
}
.story-cover::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.5));
}
.story-cover-emoji{position:relative;z-index:1}
.story-cat-tag{
  position:absolute;top:10px;left:10px;
  padding:3px 10px;border-radius:99px;
  background:rgba(0,0,0,.6);backdrop-filter:blur(8px);
  font-size:10px;font-weight:700;
  color:var(--gold-light);
  z-index:2;
}
.story-body{padding:14px;flex:1;display:flex;flex-direction:column}
.story-title{
  font-family:var(--font-story);
  font-size:15px;font-weight:700;
  color:var(--text);
  margin-bottom:6px;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
}
.story-desc{
  font-size:12px;color:var(--text-muted);
  line-height:1.5;margin-bottom:10px;
  display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;
  flex:1;
}
.story-meta{
  display:flex;align-items:center;justify-content:space-between;
  font-size:11px;color:var(--text-muted);
  padding-top:10px;border-top:1px solid var(--border-light);
}
.story-meta .author{display:flex;align-items:center;gap:6px}
.story-meta .avatar{
  width:22px;height:22px;border-radius:50%;
  background:linear-gradient(135deg,#fbbf24,#d97706);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:#fff;
}
.story-stats{display:flex;gap:10px}
.story-stats span{display:inline-flex;align-items:center;gap:3px}
.story-stats i{color:var(--gold);font-size:10px}

/* AI Badge */
.ai-badge{
  position:absolute;top:10px;right:10px;
  padding:3px 9px;border-radius:99px;
  background:linear-gradient(135deg,#8b5cf6,#7c3aed);
  font-size:9px;font-weight:800;
  color:#fff;
  z-index:2;
  letter-spacing:.5px;
}

/* ============ BOTTOM NAV ============ */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  z-index:100;
  background:rgba(26,18,8,.92);
  backdrop-filter:blur(20px);
  border-top:1px solid var(--border);
  padding:8px 0 max(8px, env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;
  max-width:1240px;margin:0 auto;
}
[data-theme="light"] .bottom-nav{background:rgba(254,249,240,.92)}
.bnav-item{
  flex:1;padding:6px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:700;
  color:var(--text-muted);
  transition:all .2s;
  background:none;border:none;cursor:pointer;
}
.bnav-item i{font-size:20px}
.bnav-item.active{color:var(--gold)}
.bnav-item:hover{color:var(--gold-light)}

/* ============ TOAST ============ */
.toast{
  position:fixed;top:80px;left:50%;
  transform:translateX(-50%) translateY(-120px);
  background:var(--surface);
  border:2px solid var(--gold);
  padding:12px 22px;border-radius:14px;
  font-size:13px;font-weight:700;
  color:var(--text);
  z-index:1000;
  transition:transform .4s cubic-bezier(.5,1.5,.7,1);
  box-shadow:0 10px 40px rgba(0,0,0,.4);
  max-width:90vw;text-align:center;
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ============ MODAL ============ */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  backdrop-filter:blur(8px);
  z-index:500;display:none;
  align-items:center;justify-content:center;padding:20px;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:var(--surface);
  border:2px solid var(--gold);
  border-radius:20px;
  padding:24px;max-width:420px;width:100%;
  animation:popIn .3s cubic-bezier(.5,1.5,.7,1);
}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}

/* ============ PAGES ============ */
.page{display:none;animation:fadeIn .4s}
.page.active{display:block}

/* ============ RESPONSIVE ============ */
@media(max-width:640px){
  .story-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .story-cover{height:110px;font-size:44px}
  .story-title{font-size:13px}
  .story-desc{font-size:11px}
  main{padding:16px 12px 90px}
  .hero{padding:22px 18px}
}
@media(max-width:400px){
  .story-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ============ SPLASH ============ -->
<div id="splash">
  <div class="book-wrap">
    <div class="book">
      <div class="book-pages">📖</div>
      <div class="book-cover">📚</div>
    </div>
  </div>
  <div class="splash-title" id="splashTitle"></div>
  <div class="splash-sub">বাংলা গল্পের জগৎ</div>
  <div class="splash-bar-wrap"><div class="splash-bar"></div></div>
  <div class="splash-status" id="splashStatus">গল্পের পাতা উল্টাচ্ছি...</div>
</div>

<!-- ============ HEADER ============ -->
<header class="header">
  <div class="header-inner">
    <button class="brand" onclick="switchPage('home')">
      <div class="brand-logo">📖</div>
      <div class="brand-text">
        <span class="brand-name">গল্প বাংলা</span>
        <span class="brand-tag">বাংলা গল্পের জগৎ</span>
      </div>
    </button>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" title="থিম">
        <i class="fas fa-sun" id="themeIcon"></i>
      </button>
      <button class="icon-btn" onclick="switchPage('profile')" title="প্রোফাইল">
        <i class="fas fa-user"></i>
      </button>
    </div>
  </div>
</header>

<!-- ============ MAIN ============ -->
<main>

  <!-- ===== HOME PAGE ===== -->
  <div class="page active" id="page-home">
    
    <!-- Hero -->
    <div class="hero">
      <div class="hero-title">স্বাগতম! 📖</div>
      <div class="hero-sub">বাংলার সেরা গল্পের জগতে। পড়ুন, লিখুন, AI দিয়ে নতুন গল্প বানান।</div>
      <div class="hero-buttons">
        <button class="hero-btn" onclick="switchPage('ai-story')">
          <i class="fas fa-magic"></i> AI গল্প বানাও
        </button>
        <button class="hero-btn ghost" onclick="switchPage('write')">
          <i class="fas fa-pen"></i> নিজে লিখুন
        </button>
      </div>
    </div>

    <!-- Categories -->
    <div class="section">
      <div class="section-head">
        <div class="section-title">
          <i class="fas fa-tags"></i>
          ক্যাটাগরি
        </div>
      </div>
      <div class="cat-scroll" id="catScroll"></div>
    </div>

    <!-- Trending -->
    <div class="section">
      <div class="section-head">
        <div class="section-title">
          <i class="fas fa-fire"></i>
          ট্রেন্ডিং গল্প
        </div>
        <span class="section-badge" id="trendingBadge">🔥 আজকের</span>
      </div>
      <div class="story-grid" id="trendingStories"></div>
    </div>

    <!-- AI Generated -->
    <div class="section">
      <div class="section-head">
        <div class="section-title">
          <i class="fas fa-robot"></i>
          AI-জেনারেটেড গল্প
        </div>
        <span class="see-all" onclick="switchPage('ai-story')">সব দেখুন <i class="fas fa-arrow-right"></i></span>
      </div>
      <div class="story-grid" id="aiStories"></div>
    </div>

    <!-- Children's Stories -->
    <div class="section">
      <div class="section-head">
        <div class="section-title">
          <i class="fas fa-child"></i>
          শিশুদের গল্প
        </div>
        <span class="see-all" onclick="filterCategory('শিশু')">সব দেখুন <i class="fas fa-arrow-right"></i></span>
      </div>
      <div class="story-grid" id="kidStories"></div>
    </div>

    <!-- Audio Stories -->
    <div class="section">
      <div class="section-head">
        <div class="section-title">
          <i class="fas fa-headphones"></i>
          অডিও গল্প
        </div>
      </div>
      <div class="story-grid" id="audioStories"></div>
    </div>

  </div>

  <!-- ===== STORY READ PAGE ===== -->
  <div class="page" id="page-story">
    <div id="storyReader"></div>
  </div>

  <!-- ===== AI STORY PAGE ===== -->
  <div class="page" id="page-ai-story">
    <div id="aiStoryUI"></div>
  </div>

  <!-- ===== WRITE PAGE ===== -->
  <div class="page" id="page-write">
    <div id="writeUI"></div>
  </div>

  <!-- ===== CATEGORY PAGE ===== -->
  <div class="page" id="page-category">
    <div id="categoryUI"></div>
  </div>

  <!-- ===== PROFILE PAGE ===== -->
  <div class="page" id="page-profile">
    <div id="profileUI"></div>
  </div>

</main>

<!-- ============ BOTTOM NAV ============ -->
<nav class="bottom-nav">
  <button class="bnav-item active" data-page="home" onclick="switchPage('home',this)">
    <i class="fas fa-home"></i>
    <span>হোম</span>
  </button>
  <button class="bnav-item" data-page="category" onclick="switchPage('category',this)">
    <i class="fas fa-book"></i>
    <span>গল্প</span>
  </button>

          '<span><i class="fas fa-heart" style="' + (liked ? 'color:#ef4444' : '') + '"></i> ' + story.likes + '</span>' +
          '<span><i class="fas fa-clock"></i> ' + story.time + '</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* ============================================================
   হোম পেজ রেন্ডার
   ============================================================ */
function renderHome(){
  // ক্যাটাগরি
  var catScroll = document.getElementById('catScroll');
  if(catScroll && !catScroll.dataset.init){
    catScroll.dataset.init = '1';
    catScroll.innerHTML = CATEGORIES.map(function(c){
      return '<button class="cat-chip' + (c.id === 'all' ? ' active' : '') + '" data-cat="' + c.id + '" onclick="filterCategory(\'' + c.id + '\')"><span class="cat-emoji">' + c.emoji + '</span>' + c.name + '</button>';
    }).join('');
  }
  
  // সব গল্প (স্টক + ইউজার + AI)
  var allStories = getAllStories();
  
  // ট্রেন্ডিং (বেশি লাইক)
  var trending = allStories.slice().sort(function(a,b){ return b.likes - a.likes; }).slice(0, 4);
  var trendingEl = document.getElementById('trendingStories');
  if(trendingEl) trendingEl.innerHTML = trending.map(renderStoryCard).join('');
  
  // AI গল্প
  var aiStories = allStories.filter(function(s){ return s.isAI; }).slice(0, 4);
  if(aiStories.length === 0){
    aiStories = allStories.filter(function(s){ return s.category === 'রহস্য'; }).slice(0, 4);
  }
  var aiEl = document.getElementById('aiStories');
  if(aiEl) aiEl.innerHTML = aiStories.map(renderStoryCard).join('');
  
  // শিশুদের গল্প
  var kidStories = allStories.filter(function(s){ return s.category === 'শিশু'; }).slice(0, 4);
  var kidEl = document.getElementById('kidStories');
  if(kidEl) kidEl.innerHTML = kidStories.map(renderStoryCard).join('');
  
  // অডিও গল্প (র‍্যান্ডম)
  var audioStories = allStories.slice().sort(function(){ return 0.5 - Math.random(); }).slice(0, 4);
  var audioEl = document.getElementById('audioStories');
  if(audioEl) audioEl.innerHTML = audioStories.map(renderStoryCard).join('');
}

function getAllStories(){
  return STOCK_STORIES.concat(APP.userStories || []);
}

/* ============================================================
   ক্যাটাগরি ফিল্টার
   ============================================================ */
function filterCategory(catId){
  var all = getAllStories();
  var filtered = catId === 'all' || catId === 'সব' ? all : all.filter(function(s){ return s.category === catId; });
  
  var container = document.getElementById('categoryUI');
  if(!container) return;
  
  var catName = catId;
  for(var i = 0; i < CATEGORIES.length; i++){
    if(CATEGORIES[i].id === catId){ catName = CATEGORIES[i].name; break; }
  }
  
  container.innerHTML = 
    '<div class="section-head" style="margin-top:10px">' +
      '<div class="section-title"><i class="fas fa-book"></i> ' + catName + ' গল্প</div>' +
      '<span class="section-badge">' + filtered.length + 'টি গল্প</span>' +
    '</div>' +
    '<div class="story-grid">' +
      (filtered.length ? filtered.map(renderStoryCard).join('') : '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-muted)">এই ক্যাটাগরিতে এখনো গল্প নেই। 🤖 AI গল্প বানাক?</div>') +
    '</div>';
  
  // ক্যাটাগরি চিপ আপডেট
  document.querySelectorAll('.cat-chip').forEach(function(c){
    c.classList.toggle('active', c.dataset.cat === catId);
  });
  
  switchPage('category');
}

/* ============================================================
   গল্প খুলুন (পড়ার জন্য)
   ============================================================ */
function openStory(id){
  var story = getAllStories().find(function(s){ return s.id === id; });
  if(!story) return;
  
  // পড়া হয়েছে মার্ক করি
  if(APP.read.indexOf(id) === -1){
    APP.read.push(id);
    saveData();
  }
  
  var reader = document.getElementById('storyReader');
  var liked = APP.liked.indexOf(id) !== -1;
  
  reader.innerHTML = 
    '<button class="hero-btn ghost" style="margin-bottom:16px" onclick="switchPage(\'home\')">' +
      '<i class="fas fa-arrow-left"></i> ফিরে যান' +
    '</button>' +
    '<div style="text-align:center;margin-bottom:24px">' +
      '<div style="font-size:72px;margin-bottom:10px">' + story.emoji + '</div>' +
      '<div style="display:inline-block;padding:4px 14px;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);border-radius:99px;font-size:11px;font-weight:700;color:var(--gold-light);margin-bottom:12px">' + story.category + '</div>' +
      '<h1 style="font-family:var(--font-story);font-size:clamp(22px,5vw,32px);font-weight:800;color:var(--text);margin-bottom:10px">' + escapeHtml(story.title) + '</h1>' +
      '<div style="font-size:13px;color:var(--text-muted);display:flex;justify-content:center;gap:16px;flex-wrap:wrap">' +
        '<span>✍️ ' + escapeHtml(story.author) + '</span>' +
        '<span>⏱️ ' + story.time + '</span>' +
        '<span>❤️ ' + story.likes + '</span>' +
      '</div>' +
    '</div>' +
    '<div style="background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:24px;line-height:2;font-size:16px;color:var(--text);white-space:pre-wrap;font-family:var(--font-bn)">' + escapeHtml(story.content) + '</div>' +
    '<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center">' +
      '<button class="hero-btn ' + (liked ? '' : 'ghost') + '" onclick="toggleLike(\'' + id + '\')" id="likeBtn">' +
        '<i class="fas fa-heart" style="' + (liked ? 'color:#ef4444' : '') + '"></i> ' + (liked ? 'লাইক করা হয়েছে' : 'লাইক করুন') +
      '</button>' +
      '<button class="hero-btn ghost" onclick="speakStory(\'' + escapeAttr(story.content.substring(0, 200)) + '\')">' +
        '<i class="fas fa-volume-up"></i> শুনুন' +
      '</button>' +
      '<button class="hero-btn ghost" onclick="shareStory(\'' + escapeAttr(story.title) + '\')">' +
        '<i class="fas fa-share"></i> শেয়ার' +
      '</button>' +
    '</div>';
  
  switchPage('story');
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function toggleLike(id){
  var idx = APP.liked.indexOf(id);
  if(idx === -1) APP.liked.push(id);
  else APP.liked.splice(idx, 1);
  saveData();
  openStory(id);
  showToast(idx === -1 ? '❤️ লাইক করা হয়েছে' : 'লাইক সরানো হয়েছে');
}

function speakStory(text){
  if(!('speechSynthesis' in window)){
    showToast('এই ব্রাউজারে অডিও সাপোর্ট নেই');
    return;
  }
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'bn-BD';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
  showToast('🔊 পড়া শুরু হয়েছে...');
}

function shareStory(title){
  if(navigator.share){
    navigator.share({ title: title, text: 'গল্প বাংলা থেকে পড়ুন: ' + title });
  } else {
    showToast('শেয়ার সাপোর্ট নেই');
  }
}

/* ============================================================
   পেজ সুইচ
   ============================================================ */
function switchPage(id, el){
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  var target = document.getElementById('page-' + id);
  if(target) target.classList.add('active');
  
  document.querySelectorAll('.bnav-item').forEach(function(b){ b.classList.remove('active'); });
  if(el) el.classList.add('active');
  else {
    var found = document.querySelector('.bnav-item[data-page="' + id + '"]');
    if(found) found.classList.add('active');
  }
  
  window.scrollTo({top: 0, behavior: 'smooth'});
  
  if(id === 'home') renderHome();
  if(id === 'category') filterCategory('all');
  if(id === 'ai-story') renderAIStoryUI();
  if(id === 'write') renderWriteUI();
  if(id === 'profile') renderProfileUI();
}

/* ============================================================
   থিম টগল
   ============================================================ */
function toggleTheme(){
  var cur = document.documentElement.getAttribute('data-theme');
  var next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  APP.theme = next;
  saveData();
  updateThemeIcon();
}
function updateThemeIcon(){
  var t = document.documentElement.getAttribute('data-theme');
  var icon = document.getElementById('themeIcon');
  if(icon) icon.className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
}

/* ============================================================
   Toast
   ============================================================ */
var TOAST_TIMER = null;
function showToast(msg){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(TOAST_TIMER);
  TOAST_TIMER = setTimeout(function(){ t.classList.remove('show'); }, 2500);
}

/* ============================================================
   Helpers
   ============================================================ */
function escapeHtml(s){
  if(s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function escapeAttr(s){
  if(s == null) return '';
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
}

/* ============================================================
   Splash + Init
   ============================================================ */
(function(){
  // "গল্প বাংলা" letter-by-letter
  var title = document.getElementById('splashTitle');
  if(title){
    'গল্প বাংলা'.split('').forEach(function(ch, i){
      var span = document.createElement('span');
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      span.style.animationDelay = (i * 0.1 + 0.3) + 's';
      title.appendChild(span);
    });
  }
  
  // Splash স্টেটাস চেঞ্জ
  var statuses = ['গল্পের পাতা উল্টাচ্ছি...', 'কল্পনার জগতে ঢুকছি...', 'প্রস্তুত হচ্ছি...'];
  var si = 0;
  var st = setInterval(function(){
    si++;
    if(si < statuses.length){
      var s = document.getElementById('splashStatus');
      if(s) s.textContent = statuses[si];
    }
  }, 800);
  
  // থিম লোড
  if(APP.theme === 'light'){
    document.documentElement.setAttribute('data-theme', 'light');
  }
  updateThemeIcon();
  
  // Splash শেষে সরান
  setTimeout(function(){
    var sp = document.getElementById('splash');
    if(sp) sp.classList.add('hide');
    clearInterval(st);
    setTimeout(function(){
      if(sp) sp.remove();
      renderHome();
    }, 800);
  }, 2800);
})();

/* ============================================================

   ============================================================ */
function generateAIStory(){
  var topic = (document.getElementById('aiTopic').value || '').trim();
  if(!topic){
    showToast('⚠️ গল্পের বিষয় লিখুন');
    return;
  }
  
  var category = document.getElementById('aiCategory').value;
  var length = document.getElementById('aiLength').value;
  var extra = document.getElementById('aiExtra').value;
  
  var btn = document.getElementById('generateBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> AI গল্প লিখছে...';
  
  var resultEl = document.getElementById('aiStoryResult');
  resultEl.innerHTML = 
    '<div style="text-align:center;padding:40px 20px">' +
      '<div style="font-size:52px;margin-bottom:16px;animation:pandaIdle 2s ease-in-out infinite">✍️</div>' +
      '<div style="font-size:14px;color:var(--text-secondary)">AI মানুষ্য ইমোশনসহ গল্প লিখছে...</div>' +
      '<div style="font-size:12px;color:var(--text-muted);margin-top:8px">রাগ, জিদ, ভালোবাসা — সব মিশিয়ে</div>' +
    '</div>';
  
  var prompt = buildStoryPrompt(topic, category, SELECTED_EMOTION, length, extra);
  var messages = [
    { role: 'system', content: AI_STORY_PROMPT },
    { role: 'user', content: prompt }
  ];
  
  callAI(messages).then(function(story){
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-magic"></i> আবার বানাও';
    
    // শিরোনাম বের করি
    var lines = story.split('\n').filter(function(l){ return l.trim(); });
    var title = lines[0] || topic;
    title = title.replace(/^["'#\s*]+|["'#\s*]+$/g, '').substring(0, 80);
    var body = lines.slice(1).join('\n\n').trim();
    if(body.length < 50) body = story;
    
    var emo = AI_EMOTIONS[SELECTED_EMOTION];
    var catEmoji = '📖';
    for(var i = 0; i < CATEGORIES.length; i++){
      if(CATEGORIES[i].id === category){ catEmoji = CATEGORIES[i].emoji; break; }
    }
    
    resultEl.innerHTML = 
      '<div style="background:var(--surface);border:2px solid var(--gold);border-radius:18px;padding:22px;margin-top:20px">' +
        '<div style="text-align:center;margin-bottom:18px">' +
          '<div style="font-size:52px;margin-bottom:8px">' + catEmoji + '</div>' +
          '<div style="display:inline-block;padding:4px 12px;background:rgba(251,191,36,.15);border-radius:99px;font-size:11px;font-weight:700;color:var(--gold-light);margin-bottom:8px">' + category + ' • ' + emo.emoji + ' ' + emo.name + '</div>' +
          '<h2 style="font-family:var(--font-story);font-size:24px;font-weight:800;color:var(--text);margin-bottom:6px">' + escapeHtml(title) + '</h2>' +
        '</div>' +
        
        '<div style="line-height:2;font-size:15px;color:var(--text);white-space:pre-wrap;padding:16px;background:var(--bg-alt);border-radius:12px">' + escapeHtml(body) + '</div>' +
        
        '<div style="display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;justify-content:center">' +
          '<button onclick="saveAIStory(\'' + escapeAttr(title) + '\',\'' + escapeAttr(body) + '\',\'' + category + '\',\'' + catEmoji + '\')" style="padding:12px 20px;border-radius:12px;background:linear-gradient(135deg,#b45309,#92400e);color:#fff;font-weight:700;font-size:13px;box-shadow:0 4px 0 #78350f;display:inline-flex;align-items:center;gap:6px">' +
            '<i class="fas fa-save"></i> সেভ করুন' +
          '</button>' +
          '<button onclick="speakStory(\'' + escapeAttr(body.substring(0, 250)) + '\')" style="padding:12px 20px;border-radius:12px;background:transparent;border:1.5px solid var(--gold);color:var(--gold-light);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:6px">' +
            '<i class="fas fa-volume-up"></i> শুনুন' +
          '</button>' +
        '</div>' +
      '</div>';
    
    showToast('✅ গল্প তৈরি হয়েছে!');
  }).catch(function(err){
    console.error(err);
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-magic"></i> আবার চেষ্টা করুন';
    resultEl.innerHTML = 
      '<div style="padding:20px;background:var(--surface);border:2px solid var(--danger);border-radius:14px;text-align:center">' +
        '<div style="font-size:32px;margin-bottom:8px">❌</div>' +
        '<div style="font-size:14px;color:var(--text)">গল্প তৈরি করতে সমস্যা হয়েছে</div>' +

      '</div>';
  });

/* ============================================================
   AI কল
   ============================================================ */
function callAI(messages){
  return fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ messages: messages })
  })
  .then(function(res){
    if(!res.ok){
      return res.text().then(function(txt){
        throw new Error('HTTP ' + res.status);
      });
    }
    return res.json();
  })
  .then(function(data){
    if(data && data.choices && data.choices[0] && data.choices[0].message){
      return data.choices[0].message.content.trim();
    }
    if(data && data.error) throw new Error(data.error.message || 'AI error');
    throw new Error('উত্তর পাওয়া যায়নি');
  });
}
